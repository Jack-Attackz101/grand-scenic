name: Import site images

on:
  push:
    paths:
      - .github/workflows/import-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from the live site
        run: |
          mkdir -p public/images
          for f in hero-original.jpg hero-tall-mountain.webp hero-tall-sky.jpg hero-wide-mountain.webp hero-wide-sky.jpg route-road.jpg; do
            curl -fsSL "https://grand-scenic.vercel.app/images/$f" -o "public/images/$f"
          done
          echo "b4d26b11f599b83c191b051ac7491b7889d1b33d  public/images/hero-original.jpg
          165d2dd71dd38208d9a6fbe61d8c2409b65de6ff  public/images/hero-tall-mountain.webp
          d138939eb6a7b9c0252d93ea140424de25b42b1e  public/images/hero-tall-sky.jpg
          f60b69c984815e04312944fd01b9dbecdd5399ac  public/images/hero-wide-mountain.webp
          17850a7377f94a1a3f8ea0ee30600ee790963bd9  public/images/hero-wide-sky.jpg
          5d8f8e4e20ed4177f1db0f49f68a5221d19d1298  public/images/route-road.jpg" | sed 's/^ *//' | sha1sum -c -
      - name: Commit images and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/import-images.yml
          git add public/images
          git commit -m "Add site images"
          git push
